# Mythnote Upptime — 公开掉线监测（独立仓，不进 lashtech-daemon）
# 探测全部为只读 GET：不改店铺、不写库、不触发支付。

owner: lashtech2026-commits
repo: mythnote-uptime

user-agent: Mythnote-Upptime/1.0

sites:
  # 1) 独立站（Shopify）
  - name: Mythnote Beauty site
    url: https://mythnotebeauty.com
    maxResponseTime: 10000
    expectedStatusCodes:
      - 200
      - 301
      - 302

  - name: Mythnote Beauty www
    url: https://www.mythnotebeauty.com
    maxResponseTime: 10000
    expectedStatusCodes:
      - 200
      - 301
      - 302

  # 2) Supabase 网关存活（不带 anon key；401=网关在应答，算正常）
  - name: Supabase REST gateway
    url: https://mggysipvazeogmhqnvcv.supabase.co/rest/v1/
    maxResponseTime: 8000
    expectedStatusCodes:
      - 401

  # 3) 公开 Edge：区域提示（只读，无鉴权）
  - name: Edge regional-hint
    url: https://mggysipvazeogmhqnvcv.supabase.co/functions/v1/regional-hint
    maxResponseTime: 8000
    expectedStatusCodes:
      - 200
      - 429

  # 4) 公开 Edge：支付回跳说明页（只读 GET，不写库；429=限流仍算服务在）
  - name: Edge payment-return
    url: https://mggysipvazeogmhqnvcv.supabase.co/functions/v1/payment-return
    maxResponseTime: 8000
    expectedStatusCodes:
      - 200
      - 429

assignees: []

status-website:
  baseUrl: /mythnote-uptime
  name: Mythnote Status
  introTitle: "Mythnote 服务状态"
  introMessage: "独立站与后台公开接口的公开监测页。掉线会自动开 GitHub Issue；邮件通知需另配 SMTP（见 README）。"
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# 邮件等通知：全部用仓库 Secrets，不要写进本文件。
# 需要的 Secret 名见 README「邮件还差什么」。
